# Binance Futures Demo — Nginx config
# Copy into /etc/nginx/sites-available/ and symlink to sites-enabled,
# or include this file from your main nginx.conf.
#
# Replace:
#   server_name  your-domain.com;
#   root         /var/www/binance-clone;
# SSL paths if you enable HTTPS below.

server {
    listen 80;
    listen [::]:80;

    server_name your-domain.com www.your-domain.com;

    # Absolute path to the project folder on the server
    root /var/www/binance-clone;
    index index.html;

    charset utf-8;

    # --- HTTPS redirect (uncomment when SSL is configured) ---
    # return 301 https://$host$request_uri;

    # --- Block internal / dev files ---
    location ~ /\.(git|cursor) {
        deny all;
        return 403;
    }

    location ^~ /.cursor/ {
        deny all;
        return 403;
    }

    location ^~ /docs/ {
        deny all;
        return 403;
    }

    location ^~ /business-contents/ {
        deny all;
        return 403;
    }

    location = /firestore.rules {
        deny all;
        return 403;
    }

    # --- Security headers (all responses) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Static assets: long cache ---
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # --- HTML: no cache ---
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # --- Main site ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Admin panel ---
    location = /admin.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/html
        application/javascript
        application/json
        image/svg+xml;

    # --- Optional custom 404 (SPA-style) ---
    # error_page 404 /index.html;

    # --- Logs (adjust paths as needed) ---
    access_log /var/log/nginx/binance-clone.access.log;
    error_log  /var/log/nginx/binance-clone.error.log;
}

